name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is not set; skipping npm publish"
            exit 0
          fi
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-personal-directive@${version}" version >/dev/null 2>&1; then
            echo "dsh-personal-directive@${version} is already published; skipping npm publish"
          else
            npm publish --provenance --access public
          fi
